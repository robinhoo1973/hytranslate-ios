name: iOS Simulator Build

# Free macOS runner: builds the iOS app, prebuilds a Q3_K_M GGUF, sideloads
# it into the simulator's Documents directory, boots the simulator, takes a
# screenshot, and uploads everything as artifacts. No Apple Developer account
# required (simulator-only, unsigned).
#
# Run cost: ~25-40 min cold, ~5 min warm (model + llama.cpp are cached).

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "tools/**"
      - ".github/workflows/ios-simulator.yml"
  pull_request:
    paths:
      - "ios/**"
      - "tools/**"
  workflow_dispatch:

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.example.hytranslate
  SIM_DEVICE: "iPhone 16"
  SIM_OS: "18.5"
  MODEL_REPO: tencent/HY-MT1.5-1.8B
  # Pin a HF revision so the cache key is stable. Update when upstream changes.
  MODEL_REVISION: main
  # Q3_K_M is small enough (~0.9 GB) to fit comfortably in CI cache (10 GB limit).
  MODEL_QUANT: Q3_K_M
  # Prebuilt llama.cpp xcframework (universal: ios + ios-sim + macos + catalyst).
  # Pin to a tagged release for reproducibility.
  LLAMA_XCFRAMEWORK_TAG: b9010

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # macos-15 default Xcode is 16.4 (DEVELOPER_DIR points at it).

      - name: Install xcodegen + aria2 + llama.cpp
        # llama.cpp formula gives us prebuilt llama-quantize / llama-cli
        # (~10x faster than building from source on the runner each time).
        run: brew install xcodegen aria2 llama.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------------- caches
      # Use restore + (later) save so the cache is written even if a downstream
      # step (e.g. simulator boot) fails. actions/cache@v4 only saves on success.
      - name: Restore HF model source cache
        id: cache-hfsrc
        uses: actions/cache/restore@v4
        with:
          path: build/models/src
          key: hfsrc-${{ env.MODEL_REPO }}-${{ env.MODEL_REVISION }}-v1

      - name: Restore GGUF model cache
        id: cache-model
        uses: actions/cache/restore@v4
        with:
          path: build/models/hy-mt-1.8b.${{ env.MODEL_QUANT }}.gguf
          key: gguf-${{ env.MODEL_REPO }}-${{ env.MODEL_REVISION }}-${{ env.MODEL_QUANT }}-v1

      # ---------------------------------------------------------------- model
      # Split into download / build / convert+quantize so each step has its own
      # timeout and progress output, and so the (slow) HF download is cached
      # independently of the (faster) GGUF conversion.
      - name: Download HF model files
        if: steps.cache-model.outputs.cache-hit != 'true' && steps.cache-hfsrc.outputs.cache-hit != 'true'
        timeout-minutes: 30
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p build/models/src
          BASE="https://huggingface.co/${MODEL_REPO}/resolve/${MODEL_REVISION}"
          AUTH=()
          if [[ -n "${HUGGING_FACE_HUB_TOKEN:-}" ]]; then
            AUTH+=(--header="Authorization: Bearer ${HUGGING_FACE_HUB_TOKEN}")
          fi
          for f in config.json generation_config.json tokenizer.json \
                   tokenizer_config.json special_tokens_map.json \
                   chat_template.jinja model.safetensors; do
            if [[ -s "build/models/src/$f" ]]; then
              echo "skip cached: $f"; continue
            fi
            aria2c \
              --console-log-level=notice --summary-interval=15 \
              -x 16 -s 16 -k 1M \
              --connect-timeout=20 --timeout=30 \
              --max-tries=10 --retry-wait=5 \
              --auto-file-renaming=false --allow-overwrite=true \
              ${AUTH[@]+"${AUTH[@]}"} \
              -d build/models/src -o "$f" "${BASE}/${f}"
          done
          ls -lh build/models/src/

      - name: Save HF model source cache
        if: always() && steps.cache-hfsrc.outputs.cache-hit != 'true' && hashFiles('build/models/src/model.safetensors') != ''
        uses: actions/cache/save@v4
        with:
          path: build/models/src
          key: ${{ steps.cache-hfsrc.outputs.cache-primary-key }}

      - name: Convert + quantize model
        if: steps.cache-model.outputs.cache-hit != 'true'
        timeout-minutes: 30
        env:
          QUANTS: ${{ env.MODEL_QUANT }}
          SMOKE_TEST: "0"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euxo pipefail
          # convert_hy_mt_to_gguf.sh skips the download step when the files
          # already exist (we just downloaded them above or restored from cache).
          REPO_ID="$MODEL_REPO" \
          OUT_DIR="$PWD/build/models" \
          LLAMA_CPP_DIR="$PWD/build/llama.cpp" \
          bash tools/convert_hy_mt_to_gguf.sh
          # Free disk: drop the f16 intermediate (~3.6 GB) before cache save.
          rm -f build/models/hy-mt-1.8b.f16.gguf
          ls -lh build/models/

      # Save the expensive caches as soon as they're populated. Without this,
      # actions/cache@v4 would only save in a post-step that runs only on
      # overall job success (post-if: success()), and any later flake would
      # discard ~25 minutes of work.
      - name: Save GGUF model cache
        if: always() && steps.cache-model.outputs.cache-hit != 'true' && hashFiles(format('build/models/hy-mt-1.8b.{0}.gguf', env.MODEL_QUANT)) != ''
        uses: actions/cache/save@v4
        with:
          path: build/models/hy-mt-1.8b.${{ env.MODEL_QUANT }}.gguf
          key: ${{ steps.cache-model.outputs.cache-primary-key }}

      # ---------------------------------------------------------------- llama.cpp xcframework
      - name: Restore llama.cpp xcframework cache
        id: cache-xcf
        uses: actions/cache/restore@v4
        with:
          path: ios/Frameworks/llama.xcframework
          key: llama-xcframework-${{ env.LLAMA_XCFRAMEWORK_TAG }}

      - name: Fetch llama.cpp xcframework
        if: steps.cache-xcf.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p ios/Frameworks
          cd "$RUNNER_TEMP"
          aria2c -x 8 -s 8 --console-log-level=warn --summary-interval=0 \
            -o llama-xcframework.zip \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_XCFRAMEWORK_TAG}/llama-${LLAMA_XCFRAMEWORK_TAG}-xcframework.zip"
          unzip -q llama-xcframework.zip
          # Archive contains build-apple/llama.xcframework/.
          mv build-apple/llama.xcframework "$GITHUB_WORKSPACE/ios/Frameworks/llama.xcframework"
          ls "$GITHUB_WORKSPACE/ios/Frameworks/llama.xcframework"

      - name: Save llama.cpp xcframework cache
        if: always() && steps.cache-xcf.outputs.cache-hit != 'true' && hashFiles('ios/Frameworks/llama.xcframework/Info.plist') != ''
        uses: actions/cache/save@v4
        with:
          path: ios/Frameworks/llama.xcframework
          key: ${{ steps.cache-xcf.outputs.cache-primary-key }}

      # ---------------------------------------------------------------- xcode build
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # ---------------------------------------------------------------- simulator boot (BEFORE build, so we can use a concrete destination)
      - name: Boot simulator
        id: boot
        run: |
          set -euxo pipefail
          UDID=$(xcrun simctl create "ci-iphone" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16" \
              "com.apple.CoreSimulator.SimRuntime.iOS-${SIM_OS//./-}")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        working-directory: ios
        run: |
          set -euxo pipefail
          set -o pipefail
          # Use a concrete destination (id=$UDID) rather than
          # 'generic/platform=iOS Simulator' — the latter sometimes only
          # produces the SwiftUI preview stub on Xcode 16, leaving the
          # final .app without a main executable or Info.plist.
          xcodebuild \
            -project HyTranslate.xcodeproj \
            -scheme HyTranslate \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | tee build/xcodebuild.log | xcpretty || {
              echo "--- last 200 lines of xcodebuild.log ---"
              tail -200 build/xcodebuild.log
              exit 1
            }

      # ---------------------------------------------------------------- simulator install/run

      - name: Install app
        run: |
          APP_PATH=$(find ios/build/Build/Products/Debug-iphonesimulator \
              -maxdepth 2 -name "HyTranslate.app" | head -1)
          test -n "$APP_PATH"
          echo "--- .app contents ---"
          ls -la "$APP_PATH"
          echo "--- Info.plist sources in repo ---"
          find ios -name "Info.plist" -not -path "*/build/*" -ls
          echo "--- generated xcodeproj plist refs ---"
          grep -RIn "Info.plist\|INFOPLIST" ios/HyTranslate.xcodeproj/project.pbxproj | head -40 || true
          echo "--- attempt install ---"
          xcrun simctl install "$UDID" "$APP_PATH"

      - name: Sideload GGUF into app Documents
        run: |
          set -euxo pipefail
          # First launch creates the data container.
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 3
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          DATA_DIR=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          mkdir -p "$DATA_DIR/Documents/models"
          cp "build/models/hy-mt-1.8b.${MODEL_QUANT}.gguf" \
             "$DATA_DIR/Documents/models/hy-mt-1.8b.${MODEL_QUANT}.gguf"
          # Mark this build as "active" so ModelStore picks it up on next launch.
          plutil -create xml1 "$DATA_DIR/Library/Preferences/${BUNDLE_ID}.plist" || true
          defaults write "$DATA_DIR/Library/Preferences/${BUNDLE_ID}" \
              activeBuildId -string "hy-mt-1.8b.${MODEL_QUANT}"
          ls -lh "$DATA_DIR/Documents/models/"

      - name: Launch app and capture screenshots
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" &
          APP_PID=$!
          sleep 8
          xcrun simctl io "$UDID" screenshot artifacts/01-launch.png
          sleep 5
          xcrun simctl io "$UDID" screenshot artifacts/02-after-load.png
          kill $APP_PID 2>/dev/null || true
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

      - name: Collect simulator logs
        if: always()
        run: |
          mkdir -p artifacts
          xcrun simctl spawn "$UDID" log show --last 5m \
              --predicate "subsystem == \"$BUNDLE_ID\" OR processImagePath ENDSWITH \"HyTranslate\"" \
              > artifacts/simulator.log 2>&1 || true

      # ---------------------------------------------------------------- artifacts
      - name: Upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-output
          path: artifacts/
          retention-days: 14

      - name: Upload .app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HyTranslate-simulator-app
          path: ios/build/Build/Products/Debug-iphonesimulator/HyTranslate.app
          retention-days: 14

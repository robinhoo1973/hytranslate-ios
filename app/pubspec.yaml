name: hytranslate
description: "HyTranslate — offline translation powered by Tencent Hy-MT1.5 + llama.cpp via fllama."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Cross-platform LLM inference (Linux / Windows / macOS / Android / iOS / Web).
  # Builds llama.cpp via Dart native-asset hooks at app build time.
  fllama:
    git:
      url: https://github.com/Telosnex/fllama.git
      ref: main

  path_provider: ^2.1.4
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

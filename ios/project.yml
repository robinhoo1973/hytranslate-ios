# Generate the Xcode project with: `xcodegen generate` (run inside ios/)
# Install XcodeGen: `brew install xcodegen`
name: HyTranslate
options:
  bundleIdPrefix: com.example.hytranslate
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  # objectVersion 56 = Xcode 14/15/16 compatible. Default is 77 (Xcode 16-only)
  # which breaks older runners. Keep this until we move to macos-15 everywhere.
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "" # fill before signing
    SWIFT_OBJC_BRIDGING_HEADER: HyTranslate/HyTranslate-Bridging-Header.h
    CLANG_ENABLE_MODULES: YES
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    GCC_C_LANGUAGE_STANDARD: "c11"
    OTHER_LDFLAGS: "-framework Metal -framework MetalKit -framework Accelerate -framework Foundation"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTS_MACCATALYST: YES
    TARGETED_DEVICE_FAMILY: "1,2,6" # iPhone, iPad, Mac

targets:
  HyTranslate:
    type: application
    platform: iOS
    sources:
      - path: HyTranslate
        excludes:
          - "**/.DS_Store"
    resources:
      - HyTranslate/Resources
    info:
      path: HyTranslate/Info.plist
      properties:
        CFBundleDisplayName: HyTranslate
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        LSApplicationCategoryType: public.app-category.productivity
        NSPhotoLibraryUsageDescription: ""
    dependencies:
      # Prebuilt llama.cpp xcframework. CI fetches it into ios/Frameworks/
      # via the "Fetch llama.cpp xcframework" workflow step.
      - framework: Frameworks/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hytranslate
        GENERATE_INFOPLIST_FILE: NO
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks
        OTHER_LDFLAGS: $(inherited) -framework llama
